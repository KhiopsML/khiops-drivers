---
# Workflow triggered manually to produce packages of each driver in different formats.
#
# Available package formats: deb, rpm, python (sdist + wheels), zip (zip with DLLs, for Windows only).
#
# The graph of job execution is the following:
#
#                    +---> build-cpack --------------> test-cpack ----------> release-cpack
#                    |
#   check-version ---+---> build-python-sdist ---+                      +---> release-python-to-testpypi
#                    +                           +---> test-python ---(OR)
#                    +---> build-python-wheel ---+                      +---> release-python-to-pypi
#
# Notes:
#   - All packages but Python packages are generated using CPack.
#   - Release jobs only run on tags.
#   - By default, the input "python_repository" is "none", so no Python package will be published, even on a tag.
#   - If on a tag and the input "python_repository" is set to "testpypi", the job releasing the Python packages to Test.PyPI.org will run.
#   - If on a tag and the input "python_repository" is set to "pypi", the job releasing the Python packages to PyPI.org will run.
#   - Not shown on the graph above is a job called "artifacts-summary" that shows the table of all the uploaded artifacts with the download links.
#     This job exists because the GitHub web interface does not always list the artifacts...
#     It will be triggered after all build-* jobs complete.

name: package

on:
  workflow_dispatch:
    inputs:
      python_repository:
        description: Python repository used for publication
        type: choice
        default: none
        options:
          - none
          - testpypi
          - pypi

defaults:
  run:
    shell: bash

env:
  KHIOPS_CORE_RELEASE: 11.0.1  # Khiops Core version used in deb and rpm testing jobs (pip testing job always installs the latest)

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch version file
        uses: actions/checkout@v7
        with:
          sparse-checkout: src/khiops_driver_common/version.hpp
          sparse-checkout-cone-mode: false

      - name: Check version
        run: |
          if ! SOURCE_VERSION=$(sed -nE 's/#define DRIVER_VERSION "([^"]+)"/\1/; t found; $ q1; d; :found; p; q0' src/khiops_driver_common/version.hpp); then
            echo "::error::Failed to parse version in file src/khiops_driver_common/version.hpp."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" = 'tag' && "$GITHUB_REF_NAME" != "$SOURCE_VERSION" ]]; then
            echo "::error::Incompatible source version '$SOURCE_VERSION' with tag '$GITHUB_REF_NAME'. Either change the tag to match the source version or modify the DRIVER_VERSION macro in src/khiops_driver_common/version.hpp."
            exit 1
          fi
          echo "Version '$SOURCE_VERSION' OK."

  # Produce the package with CPack.
  build-cpack:
    name: build-cpack-${{ matrix.driver }}-${{ matrix.os }}
    needs: check-version
    runs-on: ${{ matrix.host }}
    container: ${{ matrix.custom-container }}
    strategy:
      fail-fast: false
      matrix: &cpack-matrix
        driver: &drivers [azure, gcs, s3]
        os:
          - debian12
          - debian13
          - ubuntu2004
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
          - ubuntu2204arm
          - ubuntu2404arm
          - ubuntu2604arm
          - rockylinux9
          - rockylinux10
          - windows
        include:
          - {os: debian12     , host: ubuntu-latest   , container: debian:12    , custom-container: ghcr.io/khiopsml/khiops/khiopsdev-debian12:latest       , pkgtype: deb}
          - {os: debian13     , host: ubuntu-latest   , container: debian:13    , custom-container: ghcr.io/khiopsml/khiops/khiopsdev-debian13:latest       , pkgtype: deb}
          - {os: ubuntu2004   , host: ubuntu-latest   , container: ubuntu:20.04 , custom-container: ghcr.io/khiopsml/khiops/khiopsdev-ubuntu20.04:latest    , pkgtype: deb}
          - {os: ubuntu2204   , host: ubuntu-latest   , container: ubuntu:22.04 , custom-container: ghcr.io/khiopsml/khiops/khiopsdev-ubuntu22.04:latest    , pkgtype: deb}
          - {os: ubuntu2404   , host: ubuntu-latest   , container: ubuntu:24.04 , custom-container: ghcr.io/khiopsml/khiops/khiopsdev-ubuntu24.04:latest    , pkgtype: deb}
          - {os: ubuntu2604   , host: ubuntu-latest   , container: ubuntu:26.04 , custom-container: ghcr.io/khiopsml/khiops/khiopsdev-ubuntu26.04:latest    , pkgtype: deb}
          - {os: ubuntu2204arm, host: ubuntu-26.04-arm, container: ubuntu:22.04 , custom-container: ghcr.io/khiopsml/khiops/khiopsdev-ubuntu22.04-arm:latest, pkgtype: deb}
          - {os: ubuntu2404arm, host: ubuntu-26.04-arm, container: ubuntu:24.04 , custom-container: ghcr.io/khiopsml/khiops/khiopsdev-ubuntu24.04-arm:latest, pkgtype: deb}
          - {os: ubuntu2604arm, host: ubuntu-26.04-arm, container: ubuntu:26.04 , custom-container: ghcr.io/khiopsml/khiops/khiopsdev-ubuntu26.04-arm:latest, pkgtype: deb}
          - {os: rockylinux9  , host: ubuntu-latest   , container: rockylinux:9 , custom-container: ghcr.io/khiopsml/khiops/khiopsdev-rocky9:latest         , pkgtype: rpm}
          - {os: rockylinux10 , host: ubuntu-latest   , container: rockylinux:10, custom-container: ghcr.io/khiopsml/khiops/khiopsdev-rocky10:latest        , pkgtype: rpm}
          - {os: windows      , host: windows-latest  , container: null         , custom-container: null                                                    , pkgtype: zip}
    steps:
      - name: Install tools [deb]
        if: matrix.pkgtype == 'deb'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends build-essential coreutils debhelper git ca-certificates curl
          apt-get install -y ninja-build zip pkg-config unzip tar

      - name: Install tools [rpm]
        if: matrix.pkgtype == 'rpm'
        run: |
          dnf upgrade -y
          dnf install -y gcc-c++ rpm-build git perl zip unzip tar
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled devel
          dnf install -y ninja-build
          dnf config-manager --set-disabled devel

      - name: Determine CMake & CPack presets
        run: |
          echo "PRESET=${{ matrix.driver }}-rel" >> "$GITHUB_ENV"
          echo "PACK_PRESET=${{ matrix.driver }}-rel-${{ matrix.pkgtype }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Needed to get the vcpkg submodule of each driver.
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake [Linux] # The ones that come with most of the khiopsdev-* images are too old.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          CMAKE_ARCH=${{ endsWith(matrix.host, '-arm') && 'aarch64' || 'x86_64' }}
          CMAKE_VERSION=4.5.1
          FILENAME=cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}.tar.gz
          CHECKSUMFILENAME=cmake-${CMAKE_VERSION}-SHA-256.txt
          BASE_URL="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}"
          (
            cd "$(mktemp -d)"
            curl -fsSL -o $FILENAME "$BASE_URL/$FILENAME"
            curl -fsSL -o $CHECKSUMFILENAME "$BASE_URL/$CHECKSUMFILENAME"
            grep -F $FILENAME $CHECKSUMFILENAME | sha256sum -c -
            mkdir cmake
            tar -xf $FILENAME --strip-components=1 -C cmake
            echo "$(realpath cmake/bin)" >> "$GITHUB_PATH" # This CMake will have precedence over the one coming from the khiopsdev-* image.
          )

      - name: Check that the newer CMake is detected [Linux]
        if: runner.os == 'Linux'
        run: |
          [ "$(cmake --version | head -n 1)" = 'cmake version 4.5.1' ]

      - name: Generate build system
        env:
          VCPKG_ROOT: "" # Fix for Windows where action ilammy/msvc-dev-cmd@v1 exports this variable.
        run: cmake --preset $PRESET

      - name: Build driver
        env:
          VCPKG_ROOT: "" # Fix for Windows where action ilammy/msvc-dev-cmd@v1 exports this variable.
        run: |
          if ! cmake --build --preset $PRESET; then
            echo "Failed to build driver '${{ matrix.driver }}'."
            if [[ -f build/$PRESET/vcpkg-bootstrap.log ]]; then
              cat build/$PRESET/vcpkg-bootstrap.log
            else
              echo "Log not found."
            fi
            exit 1
          fi

      - name: Create package
        env:
          VCPKG_ROOT: "" # Fix for Windows where action ilammy/msvc-dev-cmd@v1 exports this variable.
        run: cpack --preset $PACK_PRESET

      - name: Set env vars with distro info and arch [deb]
        if: matrix.pkgtype == 'deb'
        run: |
          source /etc/os-release
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "VERSION_CODENAME=$VERSION_CODENAME" >> "$GITHUB_ENV"
          echo "ARCH=$(arch)" >> "$GITHUB_ENV"
          echo "BUILDARCH=$(dpkg --print-architecture)" >> "$GITHUB_ENV"

      - name: Set env vars with distro info and arch [rpm]
        if: matrix.pkgtype == 'rpm'
        run: |
          source /etc/os-release
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "VERSION_CODENAME=$(echo $PLATFORM_ID | cut -d':' -f2)" >> "$GITHUB_ENV"
          echo "ARCH=$(arch)" >> "$GITHUB_ENV"

      - name: Rename the package to include distro codename [deb]
        if: matrix.pkgtype == 'deb'
        run: |
          cd build/$PRESET/packages
          PKG="$(ls *.deb)"
          mv -v "$PKG" "${PKG%_*}-${VERSION_CODENAME}.${PKG##*_}"

      - name: Rename the drivers' packages to include distro codename [rpm]
        if: matrix.pkgtype == 'rpm'
        run: |
          cd build/$PRESET/packages
          PKG="$(ls *.rpm)"
          mv -v "$PKG" "${PKG%.${ARCH}*}.${VERSION_CODENAME}.${ARCH}.rpm"

      - name: Upload the package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.driver }}-${{ matrix.os }}
          path: build/${{ env.PRESET }}/packages/*.${{ matrix.pkgtype }}
          if-no-files-found: error

  # Test the package produced with CPack.
  test-cpack:
    name: test-cpack-${{ matrix.driver }}-${{ matrix.os }}
    needs: build-cpack
    runs-on: ${{ matrix.host }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix: *cpack-matrix
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Fetch GitHub actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Install Khiops Core [deb]
        if: matrix.pkgtype == 'deb'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y curl
          source /etc/os-release
          curl -L -o khiops-core.deb "https://github.com/KhiopsML/khiops/releases/download/${KHIOPS_CORE_RELEASE}/khiops-core-openmpi_${KHIOPS_CORE_RELEASE}-1-${VERSION_CODENAME}.$(dpkg --print-architecture).deb"
          dpkg -i ./khiops-core.deb || true
          apt-get -f install -y

      - name: Install Khiops core [rpm]
        if: matrix.pkgtype == 'rpm'
        run: |
          dnf install -y curl
          RPM_VERSION="${KHIOPS_CORE_RELEASE//-/_}"
          source /etc/os-release
          curl -L -o khiops-core.rpm "https://github.com/KhiopsML/khiops/releases/download/${KHIOPS_CORE_RELEASE}/khiops-core-openmpi-${RPM_VERSION}-1.${PLATFORM_ID#platform:el}.x86_64.rpm"
          dnf install -y ./khiops-core.rpm

      - name: Install Khiops core [Windows]
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-khiops-core-with-pip

      - name: Download the driver package stored as artifact
        uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.driver }}-${{ matrix.os }}
          path: artifacts

      - name: Install the driver package [deb]
        if: matrix.pkgtype == 'deb'
        run: dpkg -i ./artifacts/khiops-driver-*.deb || apt-get -f install -y

      - name: Install the drivers' package [rpm]
        if: matrix.pkgtype == 'rpm'
        run: dnf install -y ./artifacts/khiops-driver-*.rpm

      - name: Extract zip packages and deploy drivers [Windows]
        if: runner.os == 'Windows'
        run: |
          if ! ZIPFILE=$(ls artifacts/*.zip); then
            echo "Driver zip not found." >&2
            exit 1
          fi
          mkdir zip-extracted
          python -c 'import shutil, sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])' "$ZIPFILE" zip-extracted
          find zip-extracted -type f -iname '*.dll' -exec cp {} venv/Scripts \;

      - uses: ./.github/actions/test-driver-when-installed
        with:
          driver: ${{ matrix.driver }}
          pkgtype: ${{ runner.os == 'Linux' && matrix.pkgtype || '' }}
          os-description: native-${{ matrix.os }}
          azure_client_id: ${{ matrix.driver == 'azure' && github.ref_type != 'tag' && secrets.AZURE_CLIENT_ID || '' }}
          azure_tenant_id: ${{ matrix.driver == 'azure' && github.ref_type != 'tag' && secrets.AZURE_TENANT_ID || '' }}
          azure_subscription_id: ${{ matrix.driver == 'azure' && github.ref_type != 'tag' && secrets.AZURE_SUBSCRIPTION_ID || '' }}
          azure_connection_string: ${{ matrix.driver == 'azure' && github.ref_type == 'tag' && secrets.AZURE_CONNECTION_STRING || '' }}
          aws_endpoint_url: ${{ matrix.driver == 's3' && vars.AWS_ENDPOINT_URL || '' }}
          aws_access_key_id: ${{ matrix.driver == 's3' && secrets.AWS_ACCESS_KEY_ID || '' }}
          aws_secret_access_key: ${{ matrix.driver == 's3' && secrets.AWS_SECRET_ACCESS_KEY || '' }}

  # Release the packages built with cpack to GitHub Releases.
  release-cpack:
    name: release-cpack
    if: github.ref_type == 'tag'
    needs: test-cpack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the driver packages stored as artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "*.deb,*.rpm,*.zip"
          body: |
            **This release is for testing purposes only and there is no support for it.**
            **Go to https://khiops.org to install the latest supported version.**
          draft: false
          makeLatest: false
          prerelease: true
          updateOnlyUnreleased: true

  # Produce the source distribution of the Python package.
  build-python-sdist:
    name: build-python-sdist-${{ matrix.driver }}
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: *drivers
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Needed to get the vcpkg submodule of each driver.

      - name: Generate driver-specific pyproject.toml from template
        run: pip-packaging/generate-pyproject-toml.sh "${{ matrix.driver }}" < pip-packaging/pyproject.toml.template > pyproject.toml

      - name: Create sdist
        run: pipx run build --sdist

      - name: Upload the package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-sdist-${{ matrix.driver }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Produce the binary distributions (wheels) of the Python package.
  build-python-wheel:
    name: build-python-wheel-${{ matrix.driver }}-${{ matrix.os }}
    needs: check-version
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        driver: *drivers
        os: [ubuntu2604, ubuntu2604arm, macos, windows]
        include:
          - {os: ubuntu2604   , host: ubuntu-latest   }
          - {os: ubuntu2604arm, host: ubuntu-26.04-arm}
          - {os: macos        , host: macos-latest    }
          - {os: windows      , host: windows-latest  }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Needed to get the vcpkg submodule of each driver.

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate driver-specific pyproject.toml from template
        run: pip-packaging/generate-pyproject-toml.sh "${{ matrix.driver }}" < pip-packaging/pyproject.toml.template > pyproject.toml

      - name: Create wheel
        uses: pypa/cibuildwheel@v4.3.5

      - name: Upload the package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.driver }}-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Test the source distribution and the binary distributions of the Python package.
  test-python:
    name: test-python-${{ matrix.disttype }}-${{ matrix.driver }}-${{matrix.os}}
    needs: [build-python-sdist, build-python-wheel]
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        disttype: [sdist, wheel]
        driver: *drivers
        os: [ubuntu2604, ubuntu2604arm, macos, windows]
        include:
          - {os: ubuntu2604   , host: ubuntu-latest   }
          - {os: ubuntu2604arm, host: ubuntu-26.04-arm}
          - {os: macos        , host: macos-latest    }
          - {os: windows      , host: windows-latest  }
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch GitHub actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Download the driver package stored as artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.disttype == 'sdist' && format('python-sdist-{0}', matrix.driver) || format('python-wheel-{0}-{1}', matrix.driver, matrix.os) }}
          path: pkg

      - uses: ./.github/actions/install-khiops-core-with-pip

      - if: matrix.disttype == 'sdist'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install package containing driver [sdist]
        if: matrix.disttype == 'sdist'
        run: pip install pkg/khiops_driver_${{ matrix.driver }}-*.tar.gz

      - name: Install package containing driver [wheel]
        if: matrix.disttype == 'wheel'
        run: pip install --find-links=pkg --no-index khiops-driver-${{ matrix.driver }}

      - uses: ./.github/actions/test-driver-when-installed
        with:
          driver: ${{ matrix.driver }}
          os-description: python-${{ matrix.disttype }}-${{ matrix.os }}
          azure_client_id: ${{ matrix.driver == 'azure' && github.ref_type != 'tag' && secrets.AZURE_CLIENT_ID || '' }}
          azure_tenant_id: ${{ matrix.driver == 'azure' && github.ref_type != 'tag' && secrets.AZURE_TENANT_ID || '' }}
          azure_subscription_id: ${{ matrix.driver == 'azure' && github.ref_type != 'tag' && secrets.AZURE_SUBSCRIPTION_ID || '' }}
          azure_connection_string: ${{ matrix.driver == 'azure' && github.ref_type == 'tag' && secrets.AZURE_CONNECTION_STRING || '' }}
          aws_endpoint_url: ${{ matrix.driver == 's3' && vars.AWS_ENDPOINT_URL || '' }}
          aws_access_key_id: ${{ matrix.driver == 's3' && secrets.AWS_ACCESS_KEY_ID || '' }}
          aws_secret_access_key: ${{ matrix.driver == 's3' && secrets.AWS_SECRET_ACCESS_KEY || '' }}

  # Release the Python package to test.pypi.org (sdist + wheels).
  release-python-to-testpypi:
    name: release-testpypi-${{ matrix.driver }}
    if: github.ref_type == 'tag' && inputs.python_repository == 'testpypi'
    needs: test-python
    strategy:
      fail-fast: false
      matrix:
        driver: *drivers
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/khiops-driver-${{ matrix.driver }}
    permissions:
      id-token: write
    steps:
      - name: Download the drivers' package stored as artifact
        uses: actions/download-artifact@v8
        with:
          pattern: python-*-${{ matrix.driver }}*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Release the Python package to pypi.org (sdist + wheels).
  release-python-to-pypi:
    name:  release-pypi-${{ matrix.driver }}
    if: github.ref_type == 'tag' && inputs.python_repository == 'pypi'
    needs: test-python
    strategy:
      fail-fast: false
      matrix:
        driver: *drivers
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/khiops-driver-${{ matrix.driver }}
    permissions:
      id-token: write
    steps:
      - name: Download the drivers' package stored as artifact
        uses: actions/download-artifact@v8
        with:
          pattern: python-*-${{ matrix.driver }}*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  # Publish a table of all run artifacts in the workflow summary.
  artifacts-summary:
    if: always()
    needs:
      - build-cpack
      - build-python-sdist
      - build-python-wheel
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Publish artifact links in Job Summary
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;

            let page = 1;
            const artifacts = [];
            while (true) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: runId,
                per_page: 100,
                page,
              });
              artifacts.push(...response.data.artifacts);
              if (response.data.artifacts.length < 100) {
                break;
              }
              page += 1;
            }

            artifacts.sort((a, b) => a.name.localeCompare(b.name));

            const mb = (bytes) => (bytes / (1024 * 1024)).toFixed(2);
            const rows = [
              [
                { data: "Artifact", header: true },
                { data: "Size (MiB)", header: true },
                { data: "SHA256", header: true },
                { data: "Expires", header: true },
                { data: "Download", header: true },
              ],
            ];

            for (const artifact of artifacts) {
              const downloadUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${artifact.id}`;
              const digest = artifact.digest ? artifact.digest.replace(/^sha256:/, "") : "n/a";
              rows.push([
                artifact.name,
                mb(artifact.size_in_bytes),
                digest,
                artifact.expires_at,
                `<a href="${downloadUrl}">link</a>`,
              ]);
            }

            if (artifacts.length === 0) {
              await core.summary
                .addHeading("Workflow artifacts")
                .addRaw("No artifacts found for this run.")
                .write();
            } else {
              await core.summary
                .addHeading(`Workflow artifacts (${artifacts.length})`)
                .addTable(rows)
                .write();
            }