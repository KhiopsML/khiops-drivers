---
# Workflow triggered manually to produce packages of different formats that enable shipping all drivers as a single file.
#
# Available package formats: deb, rpm, pip (sdist + wheels).
#
# The graph of job execution is the following:
#
#   build-deb ----------> test-deb ---> release-deb
#
#   build-rpm ----------> test-rpm ---> release-rpm
#
#   build-pip-sdist --+             +-> release-pip-to-testpypi
#                     |             |
#                     +-> test-pip -+
#                     |             |
#   build-pip-wheels -+             +-> release-pip-to-pypi
#
# Notes:
#   - Each build or test job will only run if the input "package_format" is set to "all" or to the corresponding package format.
#   - Release jobs follow the same rule and they have additional constraints:
#     - They only run on tags.
#     - Jobs releasing to pip formats only run if the input "python_repository" is set to the corresponding Python package repository.

name: packaging
on:
  workflow_dispatch:
    inputs:
      package_format:
        description: Package format to build, test and release
        type: choice
        default: all
        options:
          - all
          - deb
          - rpm
          - pip
          # - tgz  # Disabled, see at the end of the file.
      python_repository:
        description: Python repository used for publication
        type: choice
        default: none
        options:
          - none
          - testpypi
          - pypi

defaults:
  run:
    shell: bash

env:
  KHIOPS_CORE_RELEASE: 11.0.1  # Khiops Core version used in deb and rpm testing jobs (pip testing job always installs the latest)
  # The three env vars below are used to authenticate to S3 cloud services.
  AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # Produce the deb package.
  build-deb:
    if: inputs.package_format == 'all' || inputs.package_format == 'deb'
    runs-on: ${{ matrix.setup.os }}
    strategy:
      fail-fast: false
      matrix:
        setup:
          - { os: ubuntu-latest, image: debian12 }
          - { os: ubuntu-latest, image: ubuntu24.04 }
          - { os: ubuntu-24.04-arm, image: ubuntu24.04-arm }
    container:
      image: ghcr.io/khiopsml/khiops/khiopsdev-${{ matrix.setup.image }}:latest
    steps:
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends build-essential coreutils debhelper git ca-certificates curl ninja-build zip pkg-config
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Needed to get the vcpkg submodule of each driver.
          fetch-depth: 0

      - name: Generate build system
        run: cmake --preset all-ninja-rel

      - name: Build all drivers
        run: cmake --build --preset all-ninja-rel

      - name: Show vcpkg logs on build failure
        if: failure()
        run: |
          for log in \
            build/all/ninja-rel/azure/vcpkg-bootstrap.log \
            build/all/ninja-rel/gcs/vcpkg-bootstrap.log \
            build/all/ninja-rel/s3/vcpkg-bootstrap.log
          do
            echo "==== $log ===="
            if [[ -f "$log" ]]; then
              cat "$log"
            else
              echo "Log not found"
            fi
          done

      - name: Create package with CPack
        run: (cd build/all/ninja-rel && cpack -G DEB)

      - name: Set env vars with distro info and arch
        run: |
          source /etc/os-release
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "VERSION_CODENAME=$VERSION_CODENAME" >> "$GITHUB_ENV"
          echo "ARCH=$(arch)" >> "$GITHUB_ENV"
          echo "BUILDARCH=$(dpkg --print-architecture)" >> "$GITHUB_ENV"

      - name: Rename the drivers' package to include distro codename
        run: |
          cd build/all/ninja-rel/packages
          for filename in *.deb; do
            mv -v "$filename" "${filename%_*}-${VERSION_CODENAME}.${filename##*_}"
          done

      - name: Upload the drivers' package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ env.ID }}-${{ env.VERSION_CODENAME }}-${{ env.ARCH }}
          path: build/all/ninja-rel/packages/*.deb
          if-no-files-found: error

  # Test the deb package.
  test-deb:
    if: inputs.package_format == 'all' || inputs.package_format == 'deb'
    needs: build-deb
    runs-on: ${{ matrix.setup.os }}
    strategy:
      fail-fast: false
      matrix:
        setup:
          - { os: ubuntu-latest, image: debian12 }
          - { os: ubuntu-latest, image: ubuntu24.04 }
          - { os: ubuntu-24.04-arm, image: ubuntu24.04-arm }
    container:
      image: ghcr.io/khiopsml/khiops/khiopsdev-${{ matrix.setup.image }}:latest
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Set env vars with distro info, arch and MPI impl
        run: |
          source /etc/os-release
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "VERSION_CODENAME=$VERSION_CODENAME" >> "$GITHUB_ENV"
          echo "ARCH=$(arch)" >> "$GITHUB_ENV"
          echo "BUILDARCH=$(dpkg --print-architecture)" >> "$GITHUB_ENV"
          echo "MPI_IMPLEMENTATION=openmpi" >> "$GITHUB_ENV"

      - name: Install curl and Azure CLI prerequisites
        run: apt-get update && apt-get install -y curl gnupg lsb-release

      - name: Install Khiops Core
        run: |
          curl -L "https://github.com/KhiopsML/khiops/releases/download/${KHIOPS_CORE_RELEASE}/khiops-core-${MPI_IMPLEMENTATION}_${KHIOPS_CORE_RELEASE}-1-${VERSION_CODENAME}.${BUILDARCH}.deb" --output ./khiops-core.deb
          dpkg -i ./khiops-core.deb || true
          apt-get -f install -y

      - name: Download the drivers' package stored as artifact
        uses: actions/download-artifact@v8
        with:
          name: deb-${{ env.ID }}-${{ env.VERSION_CODENAME }}-${{ env.ARCH }}
          path: artifacts

      - name: Install the drivers' package
        run: dpkg -i ./artifacts/khiops-drivers*.deb || apt-get -f install -y

      - name: Check Khiops detects drivers
        uses: ./.github/actions/test-khiops-install

      - name: Install Azure CLI
        if: github.ref_type != 'tag'
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | bash

      - name: Authenticate to Azure cloud services through WIF
        if: github.ref_type != 'tag'
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Azure cloud services through connection string env var
        if: github.ref_type == 'tag'
        run: echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_CONNECTION_STRING }}" >> "$GITHUB_ENV"

      - name: Authenticate to GCS cloud services
        uses: google-github-actions/auth@v2
        with:
          service_account: 'khiops-gcs-driver-test-sa@ino-olr-dak-ideal-sbx.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/322269704080/locations/global/workloadIdentityPools/github/providers/my-repo'

      - name: Fetch Iris dataset and Khiops testing tools
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            azure/test/LearningTest
            gcs/test/LearningTest
            s3/test/LearningTest
            LearningTestTool
          sparse-checkout-cone-mode: false

      - name: Test Khiops with Azure driver on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        env:
          AZURE_DRIVER_LOGLEVEL: warning
          AZURE_DRIVER_LOGFILE: /dev/stderr
        with:
          test-root: azure/test
          tool-root: LearningTestTool
          driver-name: azure
          os-description: ${{ env.ID }}-${{ env.VERSION_CODENAME }}-${{ env.ARCH }}

      - name: Test Khiops with GCS driver on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        env:
          GCS_DRIVER_LOGLEVEL: warning
          GCS_DRIVER_LOGFILE: /dev/stderr
        with:
          test-root: gcs/test
          tool-root: LearningTestTool
          driver-name: gcs
          os-description: ${{ env.ID }}-${{ env.VERSION_CODENAME }}-${{ env.ARCH }}

      - name: Test Khiops with S3 driver on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        env:
          S3_DRIVER_LOGLEVEL: warning
          S3_DRIVER_LOGFILE: /dev/stderr
        with:
          test-root: s3/test
          tool-root: LearningTestTool
          driver-name: s3
          os-description: ${{ env.ID }}-${{ env.VERSION_CODENAME }}-${{ env.ARCH }}

  # Release the deb package.
  release-deb:
    if: github.ref_type == 'tag' && (inputs.package_format == 'all' || inputs.package_format == 'deb')
    needs: test-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the drivers' package stored as artifact
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true

      - uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          artifacts: '*.deb'
          body: |
            **This release is for testing purposes only and there is no support for it.**
            **Go to https://khiops.org to install the latest supported version.**
          draft: false
          makeLatest: false
          prerelease: true
          updateOnlyUnreleased: true

  # Produce the rpm package.
  build-rpm:
    if: inputs.package_format == 'all' || inputs.package_format == 'rpm'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: rockylinux, os_version: '9' }
    container:
      image: ${{ matrix.os }}:${{ matrix.os_version }}
    steps:
      - name: Install packages
        run: |
          dnf upgrade -y
          dnf install -y gcc-c++ rpm-build git perl curl ninja-build zip
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled devel
          dnf install -y cmake
          dnf config-manager --set-disabled devel

      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Needed to get the vcpkg submodule of each driver.
          fetch-depth: 0

      - name: Generate build system
        run: cmake --preset all-ninja-rel

      - name: Build all drivers
        run: cmake --build --preset all-ninja-rel

      - name: Show vcpkg logs on build failure
        if: failure()
        run: |
          for log in \
            build/all/ninja-rel/azure/vcpkg-bootstrap.log \
            build/all/ninja-rel/gcs/vcpkg-bootstrap.log \
            build/all/ninja-rel/s3/vcpkg-bootstrap.log
          do
            echo "==== $log ===="
            if [[ -f "$log" ]]; then
              cat "$log"
            else
              echo "Log not found"
            fi
          done

      - name: Create package with CPack
        run: (cd build/all/ninja-rel && cpack -G RPM)

      - name: Set env vars with distro info and arch
        run: |
          source /etc/os-release
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "VERSION_CODENAME=$(echo $PLATFORM_ID | cut -d':' -f2)" >> "$GITHUB_ENV"
          echo "ARCH=$(arch)" >> "$GITHUB_ENV"

      - name: Rename the drivers' package to include distro codename
        run: |
          cd build/all/ninja-rel/packages
          for filename in *.rpm; do
            mv -v "$filename" "${filename%.${ARCH}*}.${VERSION_CODENAME}.${ARCH}.rpm"
          done

      - name: Upload the drivers' package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ env.ID }}-${{ env.VERSION_CODENAME }}-${{ env.ARCH }}
          path: build/all/ninja-rel/packages/*.rpm
          if-no-files-found: error

  # Test the rpm package.
  test-rpm:
    if: inputs.package_format == 'all' || inputs.package_format == 'rpm'
    needs: build-rpm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: rockylinux, os_version: '9' }
    container:
      image: ${{ matrix.os }}:${{ matrix.os_version }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Set env vars with distro info, arch and MPI impl
        run: |
          source /etc/os-release
          echo "ID=$ID" >> "$GITHUB_ENV"
          echo "VERSION=$(echo $PLATFORM_ID | cut -d':' -f2)" >> "$GITHUB_ENV"
          echo "ARCH=$(arch)" >> "$GITHUB_ENV"
          echo "MPI_IMPLEMENTATION=openmpi" >> "$GITHUB_ENV"

      - name: Install Khiops core
        run: |
          RPM_VERSION="${KHIOPS_CORE_RELEASE//-/_}"
          curl -L "https://github.com/KhiopsML/khiops/releases/download/${KHIOPS_CORE_RELEASE}/khiops-core-${MPI_IMPLEMENTATION}-${RPM_VERSION}-1.${VERSION}.x86_64.rpm" --output ./khiops-core.rpm
          yum install -y ./khiops-core.rpm

      - name: Download the drivers' package stored as artifact
        uses: actions/download-artifact@v8
        with:
          name: rpm-${{ env.ID }}-${{ env.VERSION }}-${{ env.ARCH }}
          path: artifacts

      - name: Install the drivers' package
        run: yum install -y ./artifacts/khiops-drivers*.rpm

      - name: Check Khiops detects drivers
        uses: ./.github/actions/test-khiops-install

      - name: Install Azure CLI
        if: github.ref_type != 'tag'
        run: |
          dnf install -y https://packages.microsoft.com/config/rhel/${{ matrix.os_version }}/packages-microsoft-prod.rpm
          dnf install -y azure-cli

      - name: Authenticate to Azure cloud services through WIF
        if: github.ref_type != 'tag'
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Azure cloud services through connection string env var
        if: github.ref_type == 'tag'
        run: echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_CONNECTION_STRING }}" >> "$GITHUB_ENV"

      - name: Authenticate to GCS cloud services
        uses: google-github-actions/auth@v2
        with:
          service_account: 'khiops-gcs-driver-test-sa@ino-olr-dak-ideal-sbx.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/322269704080/locations/global/workloadIdentityPools/github/providers/my-repo'

      - name: Fetch Iris dataset and Khiops testing tools
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            azure/test/LearningTest
            gcs/test/LearningTest
            s3/test/LearningTest
            LearningTestTool
          sparse-checkout-cone-mode: false

      - name: Test Khiops with Azure driver on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        env:
          AZURE_DRIVER_LOGLEVEL: warning
          AZURE_DRIVER_LOGFILE: /dev/stderr
        with:
          test-root: azure/test
          tool-root: LearningTestTool
          driver-name: azure
          os-description: ${{ env.ID }}-${{ env.VERSION }}-${{ env.ARCH }}

      - name: Test Khiops with GCS driver on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        env:
          GCS_DRIVER_LOGLEVEL: warning
          GCS_DRIVER_LOGFILE: /dev/stderr
        with:
          test-root: gcs/test
          tool-root: LearningTestTool
          driver-name: gcs
          os-description: ${{ env.ID }}-${{ env.VERSION }}-${{ env.ARCH }}

      - name: Test Khiops with S3 driver on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        env:
          S3_DRIVER_LOGLEVEL: warning
          S3_DRIVER_LOGFILE: /dev/stderr
        with:
          test-root: s3/test
          tool-root: LearningTestTool
          driver-name: s3
          os-description: ${{ env.ID }}-${{ env.VERSION }}-${{ env.ARCH }}

  # Release the rpm package.
  release-rpm:
    if: github.ref_type == 'tag' && (inputs.package_format == 'all' || inputs.package_format == 'rpm')
    needs: test-rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the drivers' package stored as artifact
        uses: actions/download-artifact@v8
        with:
          pattern: rpm-*
          merge-multiple: true

      - uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          artifacts: '*.rpm'
          body: |
            **This release is for testing purposes only and there is no support for it.**
            **Go to https://khiops.org to install the latest supported version.**
          draft: false
          makeLatest: false
          prerelease: true
          updateOnlyUnreleased: true

  # Produce the source distribution of the pip package.
  build-pip-sdist:
    if: inputs.package_format == 'all' || inputs.package_format == 'pip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Needed to get the vcpkg submodule of each driver.

      - run: pipx run build --sdist

      - name: Upload the drivers' package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: pip-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Produce the binary distributions (wheels) of the pip package.
  build-pip-wheels:
    if: inputs.package_format == 'all' || inputs.package_format == 'pip'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025-vs2026
          - macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Needed to get the vcpkg submodule of each driver.

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: pypa/cibuildwheel@v3.3.1

      - name: Upload the drivers' package as artifact
        uses: actions/upload-artifact@v7
        with:
          name: pip-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Test the pip package.
  test-pip:
    if: inputs.package_format == 'all' || inputs.package_format == 'pip'
    needs:
      - build-pip-sdist
      - build-pip-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025-vs2026
          - macos-15
    permissions:
      id-token: write
    steps:
      - name: Download the drivers' package stored as artifact
        uses: actions/download-artifact@v8
        with:
          pattern: pip-*
          path: wheelhouse
          merge-multiple: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Create virtual env
        run: python -m venv venv

      - name: Add the directory containing the executables to the PATH (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: echo "$(pwd)/venv/bin" >> "$GITHUB_PATH"

      - name: Add the directory containing the executables to the PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$((Resolve-Path 'venv/Scripts').Path)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Khiops Core
        run: pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple khiops-core

      - name: Install package containing drivers
        run: pip install --find-links=wheelhouse khiops-drivers

      - name: Add Intel MPI runtime to the PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $venvRoot = Resolve-Path "venv"
          $impiDll = Get-ChildItem -Path $venvRoot -Recurse -Filter "impi.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $impiDll) {
            Write-Error "impi.dll not found in venv"
            exit 1
          }
          "$($impiDll.DirectoryName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Khiops detects drivers
        uses: ./.github/actions/test-khiops-install

      - name: Authenticate to Azure cloud services through WIF
        if: github.ref_type != 'tag'
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate to Azure cloud services through connection string env var
        if: github.ref_type == 'tag'
        run: echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_CONNECTION_STRING }}" >> "$GITHUB_ENV"

      - name: Authenticate to GCS cloud services
        uses: google-github-actions/auth@v2
        with:
          service_account: 'khiops-gcs-driver-test-sa@ino-olr-dak-ideal-sbx.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/322269704080/locations/global/workloadIdentityPools/github/providers/my-repo'

      - name: Fetch Iris dataset and Khiops testing tools
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            azure/test/LearningTest
            gcs/test/LearningTest
            s3/test/LearningTest
            LearningTestTool
          sparse-checkout-cone-mode: false

      - name: Test Khiops with Azure driver on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        env:
          AZURE_DRIVER_LOGLEVEL: warning
          AZURE_DRIVER_LOGFILE: /dev/stderr
        with:
          test-root: azure/test
          tool-root: LearningTestTool
          driver-name: azure
          os-description: ${{ matrix.os }}

      - name: Test Khiops with GCS driver on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        env:
          GCS_DRIVER_LOGLEVEL: warning
          GCS_DRIVER_LOGFILE: /dev/stderr
        with:
          test-root: gcs/test
          tool-root: LearningTestTool
          driver-name: gcs
          os-description: ${{ matrix.os }}

      - name: Test Khiops with S3 driver on Iris dataset
        uses: ./.github/actions/test-khiops-on-iris
        env:
          S3_DRIVER_LOGLEVEL: warning
          S3_DRIVER_LOGFILE: /dev/stderr
        with:
          test-root: s3/test
          tool-root: LearningTestTool
          driver-name: s3
          os-description: ${{ matrix.os }}

  # Release the pip package to test.pypi.org.
  release-pip-to-testpypi:
    if: github.ref_type == 'tag' && inputs.python_repository == 'testpypi' && (inputs.package_format == 'all' || inputs.package_format == 'pip')
    needs: test-pip
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/khiops-drivers
    permissions:
      id-token: write
    steps:
      - name: Download the drivers' package stored as artifact
        uses: actions/download-artifact@v8
        with:
          pattern: pip-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Release the pip package to pypi.org.
  release-pip-to-pypi:
    if: github.ref_type == 'tag' && inputs.python_repository == 'pypi' && (inputs.package_format == 'all' || inputs.package_format == 'pip')
    needs: test-pip
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/khiops-drivers
    permissions:
      id-token: write
    steps:
      - name: Download the drivers' package stored as artifact
        uses: actions/download-artifact@v8
        with:
          pattern: pip-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

  ##### Is tar.gz distribution needed?
  #
  # build-tgz:
  #   if: inputs.package_format == 'all' || inputs.package_format == 'tgz'
  #   runs-on: ubuntu-latest
  #   container: ubuntu:24.04
  #   steps:
  #     - name: Install tools
  #       env:
  #         DEBIAN_FRONTEND: noninteractive
  #       run: apt-get update && apt-get install -y git ca-certificates

  #     - uses: actions/checkout@v7
  #       with:
