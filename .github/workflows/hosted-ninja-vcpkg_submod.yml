---
# Routine workflow executed when one pushes to the main branch or creates a PR on that branch.
# Can also be executed manually.
# This workflow checks that all drivers compile, then runs the GoogleTest test suites.
#
# The following is an overview of the steps executed by this workflow:
#
#                 +----------------------------------------------------+---------------------------------------------------+
#                 | Azure driver                                       | GCS and S3 drivers                                |
#   +-------------+--------------------------+-------------------------+-------------------------+-------------------------+
#   | Step number | Ubuntu                   | macOS and Windows       | Ubuntu                  | macOS and Windows       |
#   +-------------+--------------------------+-------------------------+-------------------------+-------------------------+
#   |           1 | Basic setup              | Basic setup             | Basic setup             | Basic setup             |
#   |           2 | Build Debug              | /                       | Build Debug             | /                       |
#   |           3 | Build Release            | Build Release           | Build Release           | Build Release           |
#   |           4 | Test Debug Emulated Blob | /                       | /                       | /                       |
#   |           5 | Test Debug Cloud Blob    | /                       | Test Debug Cloud Blob   | /                       |
#   |           6 | Test Debug Cloud File    | /                       | /                       | /                       |
#   |           7 | Test Release Cloud Blob  | Test Release Cloud Blob | Test Release Cloud Blob | Test Release Cloud Blob |
#   |           8 | Test Release Cloud File  | Test Release Cloud File | /                       | /                       |
#   |           9 | Upload test results      | Upload test results     | Upload test results     | Upload test results     |
#   |          10 | Upload libraries         | Upload libraries        | Upload libraries        | Upload libraries        |
#   +-------------+--------------------------+-------------------------+-------------------------+-------------------------+
#
# Notes:
#   - The step number does not match the number of the actual step in the workflow since this table is only a summary.
#   - Debug builds on Ubuntu are used to run tests with sanitizers enabled.
#   - Tests only write their results for Release configuration, so the only test results we can see in the reports are from tests executed in Release configuration.
#   - About the Azure driver's authentication methods used in tests:
#     - Debug-configuration tests authenticate to the emulated and cloud services using a connection string environment variable.
#     - If not on a tag, Release-configuration tests authenticate to the cloud services using Workload Identity Federation.
#     - If on a tag, Release-configuration tests authenticate to the cloud services using a connection string environment variable.

name: hosted-ninja-vcpkg_submod
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual execution.

jobs:
  build-and-test:
    name: ${{ matrix.driver }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # We use the x64-windows-static triplet for Azure and GCS drivers only because it does not work for the S3 driver.
          - { driver: azure, os: ubuntu-latest , triplet: x64-linux         , dbg_preset: azure-ninja-dbg, rel_preset: azure-ninja-rel }
          - { driver: azure, os: macos-latest  , triplet: arm64-osx         , dbg_preset: azure-ninja-dbg, rel_preset: azure-ninja-rel }
          - { driver: azure, os: macos-15-intel, triplet: x64-osx           , dbg_preset: azure-ninja-dbg, rel_preset: azure-ninja-rel }
          - { driver: azure, os: macos-14      , triplet: arm64-osx         , dbg_preset: azure-ninja-dbg, rel_preset: azure-ninja-rel }
          - { driver: azure, os: windows-latest, triplet: x64-windows-static, dbg_preset: azure-ninja-dbg, rel_preset: azure-ninja-rel }
          - { driver: gcs  , os: ubuntu-latest , triplet: x64-linux         , dbg_preset: gcs-ninja-dbg  , rel_preset: gcs-ninja-rel   }
          - { driver: gcs  , os: macos-latest  , triplet: arm64-osx         , dbg_preset: gcs-ninja-dbg  , rel_preset: gcs-ninja-rel   }
          - { driver: gcs  , os: macos-15-intel, triplet: x64-osx           , dbg_preset: gcs-ninja-dbg  , rel_preset: gcs-ninja-rel   }
          - { driver: gcs  , os: macos-14      , triplet: arm64-osx         , dbg_preset: gcs-ninja-dbg  , rel_preset: gcs-ninja-rel   }
          - { driver: gcs  , os: windows-latest, triplet: x64-windows-static, dbg_preset: gcs-ninja-dbg  , rel_preset: gcs-ninja-rel   }
          - { driver: s3   , os: ubuntu-latest , triplet: x64-linux         , dbg_preset: s3-ninja-dbg   , rel_preset: s3-ninja-rel    }
          - { driver: s3   , os: macos-latest  , triplet: arm64-osx         , dbg_preset: s3-ninja-dbg   , rel_preset: s3-ninja-rel    }
          - { driver: s3   , os: macos-15-intel, triplet: x64-osx           , dbg_preset: s3-ninja-dbg   , rel_preset: s3-ninja-rel    }
          - { driver: s3   , os: macos-14      , triplet: arm64-osx         , dbg_preset: s3-ninja-dbg   , rel_preset: s3-ninja-rel    }
          - { driver: s3   , os: windows-latest, triplet: x64-windows       , dbg_preset: s3-ninja-dbg   , rel_preset: s3-ninja-rel    }
    defaults:
      run:
        shell: bash
    permissions:
      # These permissions are, at least, needed to authenticate to cloud services.
      contents: read
      id-token: write
    env:
      # Build the correct flavour of the dependencies: architecture, OS, dynamic/static.
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      # The three environment variables below are used to authenticate to S3 cloud services.
      AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Allow the drivers to log everything. CTest will then only show the logs of a test case if it failed.
      AZURE_DRIVER_LOGFILE: /dev/stderr
      AZURE_DRIVER_LOGLEVEL: trace
      GCS_DRIVER_LOGFILE: /dev/stderr
      GCS_DRIVER_LOGLEVEL: trace
      S3_DRIVER_LOGFILE: /dev/stderr
      S3_DRIVER_LOGLEVEL: trace

    steps:

      # === DRIVER-AGNOSTIC SECTION ===

      # Install CMake.
      - name: Install CMake
        uses: lukka/get-cmake@v3.30.3

      # Fetch the sources.
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Fetch the vcpkg submodule of each driver.
          fetch-depth: 0

      # Setup vcpkg.
      - name: Restore from cache and setup vcpkg executable and data files
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: '${{ matrix.driver }}/vcpkg.json'
          vcpkgDirectory: '${{ matrix.driver }}/vcpkg'

      # [Ubuntu] Install coverage tools.
      - name: Install coverage tools [Ubuntu]
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y lcov gcovr

      # [Ubuntu] Build in debug configuration for later test execution with sanitizers.
      - name: Build in debug config [Ubuntu]
        if: matrix.os == 'ubuntu-latest'
        uses: lukka/run-cmake@v10
        with:
          configurePreset: '${{ matrix.dbg_preset }}'
          configurePresetAdditionalArgs: '["-DBUILD_TESTS=ON"]'
          buildPreset: '${{ matrix.dbg_preset }}'

      # Build in release configuration.
      - name: Build in release config
        uses: lukka/run-cmake@v10
        with:
          configurePreset: '${{ matrix.rel_preset }}'
          configurePresetAdditionalArgs: '["-DBUILD_TESTS=ON"]'
          buildPreset: '${{ matrix.rel_preset }}'


      # === AZURE-SPECIFIC SECTION ===

      # [Azure] [Windows] Fix Azure configuration path for jobs using both Bash and PowerShell.
      - name: Fix Azure config path [Azure] [Windows]
        uses: ./.github/actions/fix-win-azure-config
        if: matrix.driver == 'azure' && matrix.os == 'windows-latest'

      # [Azure] [Ubuntu] Install storage service emulator (Azurite).
      - name: Install storage service emulator [Azure] [Ubuntu]
        if: matrix.driver == 'azure' && matrix.os == 'ubuntu-latest'
        id: azuright
        uses: sgouache/azuright@v1.2
        with:
          skip-api-version-check: true

      # [Azure] [Ubuntu] Populate emulated storage with test data.
      - name: Populate emulated storage with test data [Azure] [Ubuntu]
        if: matrix.driver == 'azure' && matrix.os == 'ubuntu-latest'
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          export AZURE_STORAGE_CONNECTION_STRING='${{ steps.azuright.outputs.connstring }}'
          az storage container create -n data-test-khiops-driver-azure --connection-string "${{ steps.azuright.outputs.connstring }}"
          az storage blob upload-batch --destination data-test-khiops-driver-azure/khiops_data --source "$PWD/azure/khiops_data" --connection-string "${{ steps.azuright.outputs.connstring }}"

      # [Azure] [Ubuntu] Compute emulated storage test URL prefix.
      - name: Compute emulated storage test URL prefix [Azure] [Ubuntu]
        if: matrix.driver == 'azure' && matrix.os == 'ubuntu-latest'
        run: |
          EMULATED_BLOB_ENDPOINT=$(echo '${{ steps.azuright.outputs.connstring }}' | tr ';' '\n' | grep -E '^BlobEndpoint=' | cut -d'=' -f2)
          echo "STORAGE_DRIVER_TEST_URL_PREFIX_EMULATED_BLOB=$EMULATED_BLOB_ENDPOINT/data-test-khiops-driver-azure" >> "$GITHUB_ENV"

      # [Azure] [Ubuntu] Test in debug configuration with emulated blob storage.
      - name: Test in debug config with emulated blob storage [Azure] [Ubuntu]
        if: matrix.driver == 'azure' && matrix.os == 'ubuntu-latest'
        uses: lukka/run-cmake@v10
        with:
          testPreset: '${{ matrix.dbg_preset }}'
        env:
          AZURE_EMULATED_STORAGE: 'true'
          AZURE_STORAGE_CONNECTION_STRING: '${{ steps.azuright.outputs.connstring }}'
          STORAGE_DRIVER_TEST_URL_PREFIX: '${{ env.STORAGE_DRIVER_TEST_URL_PREFIX_EMULATED_BLOB }}'

      # [Azure] [Ubuntu] Test in debug configuration with cloud blob storage.
      - name: Test in debug config with cloud blob storage [Azure] [Ubuntu]
        if: matrix.driver == 'azure' && matrix.os == 'ubuntu-latest'
        uses: lukka/run-cmake@v10
        with:
          testPreset: 'azure-ninja-dbg-blob'
        env:
          AZURE_STORAGE_CONNECTION_STRING: '${{ secrets.AZURE_CONNECTION_STRING }}'
          CTEST_PARALLEL_LEVEL: ''

      # [Azure] [Ubuntu] Test in debug configuration with cloud file storage.
      - name: Test in debug config with cloud file storage [Azure] [Ubuntu]
        if: matrix.driver == 'azure' && matrix.os == 'ubuntu-latest'
        uses: lukka/run-cmake@v10
        with:
          testPreset: 'azure-ninja-dbg-file'
        env:
          AZURE_STORAGE_CONNECTION_STRING: '${{ secrets.AZURE_CONNECTION_STRING }}'
          CTEST_PARALLEL_LEVEL: ''

      # [Azure] Not on a tag => authenticate to cloud services using Workload Identity Federation.
      - name: Authenticate to cloud services using WIF [Azure]
        uses: azure/login@v2.3.0
        if: matrix.driver == 'azure' && github.ref_type != 'tag'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # [Azure] On a tag => authenticate to cloud services using a connection string environment variable.
      - name: Authenticate to cloud services using connection string [Azure]
        if: matrix.driver == 'azure' && github.ref_type == 'tag'
        run: echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_CONNECTION_STRING }}" >> "$GITHUB_ENV"

      # [Azure] Test in release configuration with cloud blob storage.
      - name: Test in release config with cloud blob storage [Azure]
        if: matrix.driver == 'azure'
        uses: lukka/run-cmake@v10
        with:
          testPreset: 'azure-ninja-rel-blob'
          testPresetAdditionalArgs: '["--output-junit", "test_results_blob.xml"]'
        env:
          CTEST_PARALLEL_LEVEL: ''

      # [Azure] Test in release configuration with cloud file storage.
      - name: Test in release config with cloud file storage [Azure]
        if: matrix.driver == 'azure'
        uses: lukka/run-cmake@v10
        with:
          testPreset: 'azure-ninja-rel-file'
          testPresetAdditionalArgs: '["--output-junit", "test_results_file.xml"]'
        env:
          CTEST_PARALLEL_LEVEL: ''

      # [Azure] Upload test results.
      - name: Upload test results [Azure]
        if: matrix.driver == 'azure' && always()
        uses: test-summary/action@v2
        with:
          paths: |
            ${{ github.workspace }}/build/azure/${{ matrix.rel_preset }}/test_results_blob.xml
            ${{ github.workspace }}/build/azure/${{ matrix.rel_preset }}/test_results_file.xml


      # === GCS-SPECIFIC SECTION ===

      # [GCS] Authenticate to cloud services.
      - name: Authenticate to cloud services [GCS]
        uses: google-github-actions/auth@v2
        if: matrix.driver == 'gcs'
        with:
          service_account: 'khiops-gcs-driver-test-sa@ino-olr-dak-ideal-sbx.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/322269704080/locations/global/workloadIdentityPools/github/providers/my-repo'


      # === GCS/S3-SPECIFIC SECTION ===

      # [GCS/S3] [Ubuntu] Test in debug configuration with cloud blob storage.
      - name: Test in debug config [GCS/S3] [Ubuntu]
        if: matrix.driver != 'azure' && matrix.os == 'ubuntu-latest'
        uses: lukka/run-cmake@v10
        with:
          testPreset: '${{ matrix.dbg_preset }}'
        env:
          CTEST_PARALLEL_LEVEL: ''

      # [GCS/S3] Test in release configuration with cloud blob storage.
      - name: Test in release config [GCS/S3]
        if: matrix.driver != 'azure'
        uses: lukka/run-cmake@v10
        with:
          testPreset: '${{ matrix.rel_preset }}'
          testPresetAdditionalArgs: '["--output-junit", "test_results.xml"]'
        env:
          CTEST_PARALLEL_LEVEL: ''

      # [GCS/S3] Upload test results.
      - name: Upload test results [GCS/S3]
        if: matrix.driver != 'azure' && always()
        uses: test-summary/action@v2
        with:
          paths: ${{ github.workspace }}/build/${{ matrix.driver }}/${{ matrix.rel_preset }}/test_results.xml


      # === DRIVER-AGNOSTIC SECTION ===

      # Upload built libraries.
      - name: Upload built libraries
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.driver }}-${{ matrix.os }}
          path: |
            build/${{ matrix.driver }}/${{ matrix.rel_preset }}/lib/*.dylib
            build/${{ matrix.driver }}/${{ matrix.rel_preset }}/lib/*.so
            build/${{ matrix.driver }}/${{ matrix.rel_preset }}/bin/*.dll
            build/${{ matrix.driver }}/${{ matrix.rel_preset }}/bin/*.lib
          if-no-files-found: ignore