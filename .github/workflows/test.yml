---
# Routine workflow executed when one pushes to the main branch or creates a PR on that branch.
# Can also be executed manually.
# This workflow checks that all drivers compile, then runs the GoogleTest test suites.
#
# The following is an overview of the steps executed by this workflow:
#
#   +----------------------------------------------------+---------------------------------------------------+
#   | Azure driver                                       | GCS and S3 drivers                                |
#   +--------------------------+-------------------------+-------------------------+-------------------------+
#   | Ubuntu                   | macOS and Windows       | Ubuntu                  | macOS and Windows       |
#   +--------------------------+-------------------------+-------------------------+-------------------------+
#   | Basic setup              | Basic setup             | Basic setup             | Basic setup             |
#   | Build Debug              | /                       | Build Debug             | /                       |
#   | Build Release            | Build Release           | Build Release           | Build Release           |
#   | Test Debug Emulated Blob | /                       | /                       | /                       |
#   | Test Debug Cloud Blob    | /                       | Test Debug Cloud Blob   | /                       |
#   | Test Debug Cloud File    | /                       | /                       | /                       |
#   | Test Release Cloud Blob  | Test Release Cloud Blob | Test Release Cloud Blob | Test Release Cloud Blob |
#   | Test Release Cloud File  | Test Release Cloud File | /                       | /                       |
#   | Upload test results      | Upload test results     | Upload test results     | Upload test results     |
#   | Upload libraries         | Upload libraries        | Upload libraries        | Upload libraries        |
#   +--------------------------+-------------------------+-------------------------+-------------------------+
#
# Notes:
#   - Debug builds on Ubuntu are used to run tests with sanitizers enabled.
#   - Tests only write their results for Release configuration, so the only test results we can see in the reports are from tests executed in Release configuration.
#   - About the Azure driver's authentication methods used in tests:
#     - Debug-configuration tests authenticate to the emulated and cloud services using a connection string environment variable.
#     - If not on a tag, Release-configuration tests authenticate to the cloud services using Workload Identity Federation.
#     - If on a tag, Release-configuration tests authenticate to the cloud services using a connection string environment variable.

name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual execution.

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: ${{ matrix.driver }}-${{ matrix.os }}
    runs-on: ${{ matrix.host }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        driver: [azure, gcs, s3]
        os: [debian13, ubuntu2604, ubuntu2604arm, rockylinux10, macos, macosintel, windows]
        include:
          - {os: debian13     , host: ubuntu-latest   , container: debian:13    }
          - {os: ubuntu2604   , host: ubuntu-latest   , container: ubuntu:26.04 }
          - {os: ubuntu2604arm, host: ubuntu-26.04-arm, container: ubuntu:26.04 }
          - {os: rockylinux10 , host: ubuntu-latest   , container: rockylinux:10}
          - {os: macos        , host: macos-latest    , container: null         }
          - {os: macosintel   , host: macos-26-intel  , container: null         }
          - {os: windows      , host: windows-latest  , container: null         }
    permissions:
      # These permissions are, at least, needed to authenticate to cloud services.
      contents: read
      id-token: write

    steps:

      # === DRIVER-AGNOSTIC SECTION ===

      # [Debian/Ubuntu] Install tools needed to compile, and install and run Azurite storage emulator.
      - name: Install tools and run Azurite [Debian/Ubuntu]
        if: startsWith(matrix.container, 'debian') || startsWith(matrix.container, 'ubuntu')
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y unzip git pkg-config curl zip build-essential nodejs npm
          npm install --global azurite@3
          azurite --location "$(mktemp -d)" --silent --blobHost 127.0.0.1 --blobPort 10000 &
          until curl -o /dev/null http://127.0.0.1:10000/; do
            sleep 1
          done

      # [Rocky Linux] Install tools needed to compile, and install and run Azurite storage emulator.
      - name: Install tools and run Azurite [Rocky Linux]
        if: startsWith(matrix.container, 'rockylinux')
        run: |
          dnf install -y unzip git pkg-config curl zip gcc gcc-c++ glibc-devel perl libasan libubsan libatomic nodejs npm
          echo "$(dirname "$(command -v git)")" >> "$GITHUB_PATH"
          npm install --global azurite@3
          azurite --location "$(mktemp -d)" --silent --blobHost 127.0.0.1 --blobPort 10000 &
          until curl -o /dev/null http://127.0.0.1:10000/; do
            sleep 1
          done

      # Install CMake.
      - name: Install CMake
        uses: lukka/get-cmake@v3.30.3

      # Activate development environment on Windows.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Fetch the sources.
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Fetch the vcpkg submodule of each driver.
          fetch-depth: 0

      # Allow the driver to log everything. CTest will then only show the logs of a test case if it failed.
      - name: Enable driver logs
        run: |
          case ${{ matrix.driver }} in
            azure)
              echo "AZURE_DRIVER_LOGLEVEL=warning" >> "$GITHUB_ENV"
              echo "AZURE_DRIVER_LOGFILE=/dev/stderr" >> "$GITHUB_ENV"
              ;;
            gcs)
              echo "GCS_DRIVER_LOGLEVEL=warning" >> "$GITHUB_ENV"
              echo "GCS_DRIVER_LOGFILE=/dev/stderr" >> "$GITHUB_ENV"
              ;;
            s3)
              echo "S3_DRIVER_LOGLEVEL=warning" >> "$GITHUB_ENV"
              echo "S3_DRIVER_LOGFILE=/dev/stderr" >> "$GITHUB_ENV"
              ;;
            *) echo "Unknown driver '${{ matrix.driver }}'" >&2 && exit 1;;
          esac

      # [Linux] Build in debug configuration for later test execution with sanitizers.
      - name: Build in debug config [Linux]
        if: runner.os == 'Linux'
        uses: lukka/run-cmake@v10
        with:
          configurePreset: '${{ matrix.driver }}-dbg-testing'
          buildPreset: '${{ matrix.driver }}-dbg-testing'

      # Build in release configuration.
      - name: Build in release config
        uses: lukka/run-cmake@v10
        with:
          configurePreset: '${{ matrix.driver }}-rel-testing'
          buildPreset: '${{ matrix.driver }}-rel-testing'
        env:
          VCPKG_ROOT: "" # Fix for Windows where action ilammy/msvc-dev-cmd@v1 exports this variable.


      # === AZURE-SPECIFIC SECTION ===

      # [Azure] [Debian/Ubuntu] Install Azure CLI.
      - name: Install Azure CLI [Azure] [Debian/Ubuntu]
        if: matrix.driver == 'azure' && (startsWith(matrix.container, 'debian') || startsWith(matrix.container, 'ubuntu'))
        run: curl -fsSL 'https://azurecliprod.blob.core.windows.net/$root/deb_install.sh' | bash

      # [Azure] [Rocky Linux] Install Azure CLI.
      - name: Install Azure CLI [Azure] [Rocky Linux]
        if: matrix.driver == 'azure' && startsWith(matrix.container, 'rockylinux')
        run: |
          rpm --import https://packages.microsoft.com/keys/microsoft-2025.asc
          dnf install -y https://packages.microsoft.com/config/rhel/10/packages-microsoft-prod.rpm
          dnf install -y azure-cli

      # [Azure] [Linux] Populate emulated storage with test data.
      - name: Populate emulated storage with test data [Azure] [Linux]
        if: matrix.driver == 'azure' && runner.os == 'Linux'
        run: |
          # Default Azurite connection string.
          CONNSTR='DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;'
          az storage container create -n data-test-khiops-driver-azure --connection-string "$CONNSTR"
          az storage blob upload-batch --destination data-test-khiops-driver-azure/khiops_data --source "$PWD/khiops_data" --connection-string "$CONNSTR"

      # [Azure] [Linux] Test in debug configuration with emulated blob storage.
      - name: Test in debug config with emulated blob storage [Azure] [Linux]
        if: matrix.driver == 'azure' && runner.os == 'Linux'
        uses: lukka/run-cmake@v10
        with:
          testPreset: '${{ matrix.driver }}-dbg-testing-emulated-blob'

      # [Azure] [Linux] Test in debug configuration with cloud blob storage.
      - name: Test in debug config with cloud blob storage [Azure] [Linux]
        if: matrix.driver == 'azure' && runner.os == 'Linux'
        uses: lukka/run-cmake@v10
        with:
          testPreset: '${{ matrix.driver }}-dbg-testing-blob'
        env:
          AZURE_STORAGE_CONNECTION_STRING: '${{ secrets.AZURE_CONNECTION_STRING }}'
          CTEST_PARALLEL_LEVEL: ''

      # [Azure] [Linux] Test in debug configuration with cloud file storage.
      - name: Test in debug config with cloud file storage [Azure] [Linux]
        if: matrix.driver == 'azure' && runner.os == 'Linux'
        uses: lukka/run-cmake@v10
        with:
          testPreset: '${{ matrix.driver }}-dbg-testing-file'
        env:
          AZURE_STORAGE_CONNECTION_STRING: '${{ secrets.AZURE_CONNECTION_STRING }}'
          CTEST_PARALLEL_LEVEL: ''

      # [Azure] Not on a tag => authenticate to cloud services using Workload Identity Federation.
      - name: Authenticate to cloud services using WIF [Azure]
        if: matrix.driver == 'azure' && github.ref_type != 'tag'
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # [Azure] On a tag => authenticate to cloud services using a connection string environment variable.
      - name: Authenticate to cloud services using connection string [Azure]
        if: matrix.driver == 'azure' && github.ref_type == 'tag'
        run: echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_CONNECTION_STRING }}" >> "$GITHUB_ENV"

      # [Azure] Test in release configuration with cloud blob storage.
      - name: Test in release config with cloud blob storage [Azure]
        if: matrix.driver == 'azure'
        uses: lukka/run-cmake@v10
        with:
          testPreset: '${{ matrix.driver }}-rel-testing-blob'
          testPresetAdditionalArgs: '["--output-junit", "test_results_blob.xml"]'
        env:
          CTEST_PARALLEL_LEVEL: ''
          VCPKG_ROOT: "" # Fix for Windows where action ilammy/msvc-dev-cmd@v1 exports this variable.

      # [Azure] Test in release configuration with cloud file storage.
      - name: Test in release config with cloud file storage [Azure]
        if: matrix.driver == 'azure'
        uses: lukka/run-cmake@v10
        with:
          testPreset: '${{ matrix.driver }}-rel-testing-file'
          testPresetAdditionalArgs: '["--output-junit", "test_results_file.xml"]'
        env:
          CTEST_PARALLEL_LEVEL: ''
          VCPKG_ROOT: "" # Fix for Windows where action ilammy/msvc-dev-cmd@v1 exports this variable.


      # === GCS-SPECIFIC SECTION ===

      # [GCS] Authenticate to cloud services.
      - name: Authenticate to cloud services [GCS]
        if: matrix.driver == 'gcs'
        uses: google-github-actions/auth@v2
        with:
          service_account: 'khiops-gcs-driver-test-sa@ino-olr-dak-ideal-sbx.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/322269704080/locations/global/workloadIdentityPools/github/providers/my-repo'
      

      # === S3-SPECIFIC SECTION ===

      # [S3] Authenticate to cloud services.
      - name: Authenticate to cloud services [S3]
        if: matrix.driver == 's3'
        run: |
          echo "AWS_ENDPOINT_URL=${{ vars.AWS_ENDPOINT_URL }}" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"


      # === GCS/S3-SPECIFIC SECTION ===

      # [GCS/S3] [Linux] Test in debug configuration with cloud blob storage.
      - name: Test in debug config [GCS/S3] [Linux]
        if: matrix.driver != 'azure' && runner.os == 'Linux'
        uses: lukka/run-cmake@v10
        with:
          testPreset: '${{ matrix.driver }}-dbg-testing-blob'
        env:
          CTEST_PARALLEL_LEVEL: ''

      # [GCS/S3] Test in release configuration with cloud blob storage.
      - name: Test in release config [GCS/S3]
        if: matrix.driver != 'azure'
        uses: lukka/run-cmake@v10
        with:
          testPreset: '${{ matrix.driver }}-rel-testing-blob'
          testPresetAdditionalArgs: '["--output-junit", "test_results.xml"]'
        env:
          CTEST_PARALLEL_LEVEL: ''
          VCPKG_ROOT: "" # Fix for Windows where action ilammy/msvc-dev-cmd@v1 exports this variable.


      # === DRIVER-AGNOSTIC SECTION ===
      
      # Upload test results.
      - name: Upload test results
        if: always()
        uses: test-summary/action@v2
        with:
          paths: build/${{ matrix.driver }}-rel-testing/test_results*.xml

      # Upload built libraries.
      - name: Upload built libraries
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.driver }}-${{ matrix.os }}
          path: |
            build/${{ matrix.driver }}-rel-testing/outputs/*.dylib
            build/${{ matrix.driver }}-rel-testing/outputs/*.so
            build/${{ matrix.driver }}-rel-testing/outputs/*.dll
            build/${{ matrix.driver }}-rel-testing/outputs/*.lib
          if-no-files-found: ignore