---
name: Test Khiops on Iris
description: Test a Khiops installation on the Iris dataset of a specific driver
inputs:
  test-root:
    description: Driver test root directory, for example azure/test
    required: true
  tool-root:
    description: Path to the LearningTestTool directory, for example LearningTestTool
    required: true
  driver-name:
    description: Short driver name used in artifact names
    required: true
  os-description:
    description: OS description used to name artifacts
    required: true
  show-openmpi-errors:
    description: Set to false to stop displaying full OpenMPI error log
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Python setup for Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v python3 &> /dev/null; then
          if [[ -d /etc/apt ]]; then
            apt-get update
            apt-get install -y python3 > /dev/null
          else
            yum check-update || true
            yum install -y python3.11
          fi
        fi
        echo "PYTHON=python3" >> "$GITHUB_ENV"

    - name: Python setup for Windows or macOS
      if: runner.os == 'Windows' || runner.os == 'macOS'
      shell: bash
      run: echo "PYTHON=python" >> "$GITHUB_ENV"

    - name: Set the Khiops launcher path
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          khiops_cmd=$(pwsh -NoLogo -NoProfile -Command "(Get-Command khiops.cmd -ErrorAction SilentlyContinue)?.Source")
          if [[ -z "${khiops_cmd:-}" ]]; then
            khiops_cmd=$(pwsh -NoLogo -NoProfile -Command "(Get-Command khiops -ErrorAction Stop).Source")
          fi
          # Normalize CRLF output from PowerShell before exporting to GITHUB_ENV.
          khiops_cmd="${khiops_cmd%$'\r'}"
        else
          khiops_cmd=$(command -v khiops || true)
        fi

        if [[ -z "${khiops_cmd:-}" ]]; then
          echo "::error::Unable to locate 'khiops' executable in PATH"
          echo "PATH=$PATH"
          exit 1
        fi

        echo "KHIOPS_SCRIPT=$khiops_cmd" >> "$GITHUB_ENV"

    - name: Copy Azure directory to root home in container jobs
      if: ${{ job.container.id != '' }}
      shell: bash
      run: |
        if [[ -d "$HOME/.azure" && "$HOME" != "/root" ]]; then
          mkdir -p /root/.azure
          cp -r "$HOME/.azure/." /root/.azure/ || true
        fi

    - name: Run Khiops tests
      shell: bash
      env:
        KHIOPS_PROC_NUMBER: 4
        OMPI_MCA_rmaps_base_oversubscribe: true
        PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe
        KHIOPS_API_MODE: true
        KHIOPS_MPI_VERBOSE: ${{ inputs.show-openmpi-errors }}
      run: |
        set -euo pipefail
        cd "${{ inputs.test-root }}/LearningTest/TestKhiops/Standard/Iris"
        "$KHIOPS_SCRIPT" -b -i test.prm -e results/err.txt

    - name: Check test results
      shell: bash
      run: |
        set -uo pipefail
        iris_path="$GITHUB_WORKSPACE/${{ inputs.test-root }}/LearningTest/TestKhiops/Standard/Iris"
        tool_py="$GITHUB_WORKSPACE/${{ inputs.tool-root }}/py"
        comparison_log="$iris_path/comparisonResults.log"
        err_file="$iris_path/results/err.txt"
        kht_log="/tmp/khiops-log.txt"

        print_failure_logs() {
          if [[ -f "$comparison_log" ]]; then
            echo "==== $comparison_log ===="
            cat "$comparison_log"
          else
            echo "Comparison log not found: $comparison_log"
          fi

          if [[ -f "$err_file" ]]; then
            echo "==== $err_file ===="
            cat "$err_file"
          else
            echo "Error file not found: $err_file"
          fi
        }

        touch "$iris_path/results/time.log"

        "$PYTHON" "$tool_py/kht_test.py" "$iris_path" check
        rc=$?
        if [[ $rc -ne 0 ]]; then
          print_failure_logs
          exit $rc
        fi

        "$PYTHON" "$tool_py/kht_apply.py" "$iris_path" errors | tee "$kht_log"
        rc=$?
        if [[ $rc -ne 0 ]]; then
          print_failure_logs
          exit $rc
        fi

        "$PYTHON" "$tool_py/kht_collect_results.py" "$iris_path" "$GITHUB_WORKSPACE/results/khiops/${{ inputs.driver-name }}" --collect-type warnings
        rc=$?
        if [[ $rc -ne 0 ]]; then
          print_failure_logs
          exit $rc
        fi

        if grep -q error "$kht_log"; then
          echo "::error::Errors in Khiops run"
          print_failure_logs
          exit 1
        fi

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ inputs.driver-name }}-${{ inputs.os-description }}
        retention-days: 7
        path: |
          ${{ inputs.test-root }}/LearningTest/TestKhiops/Standard/Iris/results
          results/