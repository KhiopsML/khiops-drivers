---
name: Test Khiops Installation
description: Test Khiops detection of installed drivers
inputs:
  driver:
    description: The driver that Khiops should detect
    required: true
runs:
  using: composite
  steps:
    - name: Check Khiops output
      shell: bash
      env:
        KHIOPS_PROC_NUMBER: 4
        OMPI_MCA_rmaps_base_oversubscribe: true
        PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe
        KHIOPS_MPI_VERBOSE: true
      run: |
        case ${{ inputs.driver }} in
          azure) EXPECTED='Azure driver';;
          gcs) EXPECTED='GCS driver';;
          s3) EXPECTED='S3 driver';;
          *) echo "Unknown driver '${{ inputs.driver }}'" >&2 && exit 1;;
        esac
        
        if [ "$(khiops -v | wc -l)" -gt 1 ]; then
          echo "::error::Unexpected output in 'khiops -v'"
          exit 1
        fi

        if ! KHIOPS_S_OUTPUT=$(khiops -s); then
          echo "::error::Error executing 'khiops -s'"
          exit 1
        fi

        if [[ "$KHIOPS_S_OUTPUT" != *"$EXPECTED"* ]]; then
          echo "::error::Expected string '$EXPECTED' not found in 'khiops -s' output"
          exit 1
        fi