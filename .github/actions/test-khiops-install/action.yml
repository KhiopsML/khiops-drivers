---
name: Test Khiops Installation
description: Test Khiops detection of installed drivers
inputs:
  driver:
    description: The driver that Khiops should detect
    required: true
runs:
  using: composite
  steps:
    - name: Check Khiops output
      shell: bash
      env:
        KHIOPS_PROC_NUMBER: 4
        OMPI_MCA_rmaps_base_oversubscribe: true
        PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe
        KHIOPS_MPI_VERBOSE: true
        DRIVER: ${{ inputs.driver }}
        KHIOPS: ${{ runner.os == 'Windows' && 'khiops.cmd' || 'khiops' }}
      run: |
        case "$DRIVER" in
          azure) EXPECTED='Azure driver';;
          gcs) EXPECTED='GCS driver';;
          s3) EXPECTED='S3 driver';;
          *) echo "Unknown driver '$DRIVER'" >&2 && exit 1;;
        esac

        echo "> $KHIOPS -v"
        KHIOPS_V_OUTPUT="$($KHIOPS -v)" || { echo "::error::Error executing '$KHIOPS -v'" >&2 && exit 1; }
        echo "$KHIOPS_V_OUTPUT"
        [ "$(echo "$KHIOPS_V_OUTPUT" | wc -l)" -eq 1 ] || { echo "::error::Unexpected output in '$KHIOPS -v'" >&2 && exit 1; }

        echo "> $KHIOPS -s"
        KHIOPS_S_OUTPUT="$($KHIOPS -s)" || { echo "::error::Error executing '$KHIOPS -s'" >&2 && exit 1; }
        echo "$KHIOPS_S_OUTPUT"
        [[ "$KHIOPS_S_OUTPUT" == *"$EXPECTED"* ]] || { echo "::error::Expected string '$EXPECTED' not found in '$KHIOPS -s' output" >&2 && exit 1; }